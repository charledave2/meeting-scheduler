name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android-apk.yml"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meeting-scheduler-android-v0.30.0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Package Android project source
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release:')
        run: zip -rq ../meeting-scheduler-android-source.zip . -x "*/build/*" ".gradle/*" "*/.gradle/*"
      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release:')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          TAG="v$VERSION"
          gh release create "$TAG" \
            "app/build/outputs/apk/debug/app-debug.apk" \
            "../meeting-scheduler-android-source.zip" \
            --title "Meeting Scheduler $TAG" \
            --notes-file ../CHANGELOG.md \
            --target "$GITHUB_SHA"
