name: Validate Android PR

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/validate-android-pr.yml"

permissions:
  contents: read

concurrency:
  group: android-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: jw-meeting-manager-pr-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
